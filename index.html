<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Cricket Scorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- HOME SCREEN -->
        <section id="home-screen" class="screen active">

            <div class="app-header">
                <h1>🏏 Local Cricket Scorer</h1>
                <p>Simple • Fast • Offline</p>
            </div>

            <div class="home-content">

                <button id="btn-new-tournament" class="btn btn-primary">
                    + New Tournament
                </button>

                <button id="btn-view-tournaments" class="btn btn-secondary">
                    📋 View Tournaments
                </button>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
